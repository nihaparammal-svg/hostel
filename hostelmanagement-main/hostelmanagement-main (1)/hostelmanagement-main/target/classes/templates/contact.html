<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            margin: 0;
            background: #f3f5f9;
            color: #263445;
        }
        header {
            background: #142d4e;
            color: white;
            padding: 22px 35px;
        }
        header h1 {
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 35px auto;
            padding: 0 20px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }
        h2 {
            color: #142d4e;
        }
        .panel {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(20, 45, 78, 0.08);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd5e0;
            border-radius: 6px;
            font-size: 15px;
        }
        textarea {
            resize: vertical;
            min-height: 120px;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #142d4e;
        }
        .btn {
            background: #142d4e;
            color: white;
            padding: 12px 22px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }
        .btn:hover {
            background: #244c78;
        }
        .note {
            color: #657386;
            font-size: 14px;
            margin-top: 18px;
            line-height: 1.5;
        }
        .back-btn {
            display: inline-block;
            background: #142d4e;
            color: white;
            padding: 11px 18px;
            border-radius: 6px;
            text-decoration: none;
        }
        footer {
            text-align: center;
            padding: 25px;
            color: #657386;
        }
    </style>
</head>
<body>
<header>
    <h1>Hostel Management System</h1>
</header>
<main class="container">
    <div class="top-bar">
        <div>
            <h2>Contact Us</h2>
            <p>Send us your questions or feedback.</p>
        </div>
        <a href="/dashboard" class="back-btn">Back to Dashboard</a>
    </div>
    <section class="panel">
        <form action="/contact" method="post">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name"
                       placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message"
                          placeholder="Write your message here"
                          required></textarea>
            </div>
            <button type="submit" class="btn">Send Message</button>
        </form>
        <p class="note">
            The contact form will be connected to the backend later.
        </p>
    </section>
</main>
<footer>
    &copy; 2026 Hostel Management System
</footer>
</body>
</html>
